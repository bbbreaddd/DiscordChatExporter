# Watcher config (created automatically on first container start if missing).
#
# EDIT THIS FILE, then restart the container:
#   1. Set your bot token: either DISCORD_TOKEN in the compose env (.env), or uncomment
#      `token-file` below and drop the token in config/tokens.txt.
#   2. Replace `id` with your server (guild) id, and set `name` / `output`.
#
# Paths are INSIDE the container: /config (this file) and /data (databases + media) are the two
# mounted volumes. Every option is shown below with its default -- change what you want.
#
# `defaults:` are inherited by every server; each server entry can override any subset of them.
# The config may list several servers, but one is watched per run (the single `enabled` one, or
# `--server <name|id>`). Run one container per server to watch several at once.

# token-file: /config/tokens.txt      # or set DISCORD_TOKEN in the compose environment
respect-rate-limits: true             # false = only back off on hard 429s (faster, riskier)

defaults:
  media:
    enabled: true
    # %SERVER% / %NAME% -> server name, %ID% -> server id.
    dir: /data/media/%SERVER%
    # Asset kinds to download. Remove any you don't want.
    assets: [attachments, avatars, emojis, stickers, guild-icons, guild-banners, role-icons, user-banners]

  data:
    reactions: true       # store each message's reactions + counts (from the payload, free)
    reactors: false       # ALSO fetch the full reactor list per emoji during catch-up/rescan
                          # (expensive: one paginated request per emoji per message). Live
                          # reactions are recorded from the gateway regardless.
    embeds: true
    stickers: true
    polls: true
    threads: true         # enumerate & watch threads (and thread creates)
    pins: true            # track pin changes
    members: true         # capture author guild-member info (nick/roles/join date) from the gateway
    guild-catalog: true   # periodically sync roles / emoji / stickers / scheduled events

  behavior:
    catch-up: true            # on connect, backfill every channel from its stored cursor
    scan-missing: false       # on connect, full re-scan of every channel (heavier than catch-up)
    catch-up-parallel: 10     # channels exported concurrently (per-channel rate limits are independent)
    retry-failed: false       # retry media URLs previously recorded as permanently gone (404/410)

  exclude:
    channels: []          # channel ids to skip entirely
    categories: []        # category ids -> skips all channels under them
    nsfw: false           # skip channels flagged NSFW
    threads: false        # skip all threads

servers:
  - name: MyServer
    id: REPLACE_WITH_SERVER_ID        # your server (guild) id
    enabled: true
    output: /data/MyServer.db
    # Per-server overrides of the defaults above, e.g.:
    # media:
    #   dir: /data/media/myserver
    # exclude:
    #   channels: [111111111111111111]   # e.g. a staff channel

  # - name: AnotherServer
  #   id: 222222222222222222
  #   enabled: false
  #   output: /data/AnotherServer.db
