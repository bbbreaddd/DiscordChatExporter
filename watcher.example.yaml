# Example config for the `watch` command:
#   DiscordChatExporter.Cli watch --config watcher.yaml
#
# `defaults:` are inherited by every server; each server entry overrides any subset of them
# (merged field-by-field). Only `token`/`token-file` and, per server, `name` + `id` + `output`
# are required -- everything else has a sensible default, so a minimal config is just those.
#
# The config may list several servers, but one is watched per run: the single `enabled` one, or
# the one chosen with `--server <name|id>`. Run one process per server to watch several at once.

# One of token / token-file is required. token-file may hold multiple tokens (one per line) used
# as fallbacks for one another. (In Docker you can instead set the DISCORD_TOKEN env var.)
token-file: /path/to/tokens.txt
# token: "your-token-here"

# Respect Discord's advisory rate limits (recommended). false = only back off on hard 429s.
respect-rate-limits: true

# Operator notifications via the bundled Apprise CLI (100+ services from one config). Process-wide,
# so it lives here rather than per-server. Disabled by default.
notifications:
  enabled: false
  # Any Apprise service URLs -- Discord webhook, Telegram, ntfy, email, ... See
  # https://github.com/caronc/apprise/wiki for the full URL syntax.
  urls:
    - "discord://webhook_id/webhook_token"
  on:                       # which events fire a notification
    fatal-close: true       # gateway fatal close (revoked token/intents) -- the watcher is stopping
    connection-down: true   # gateway stuck reconnecting (raised once per outage)
    backup-failure: true    # a scheduled backup threw or failed its integrity check
    backup-success: false   # every successful backup (noisy; off by default)
    full-scan-complete: true

defaults:
  media:
    enabled: true
    # %SERVER% / %NAME% -> server name, %ID% -> server id (handy for a shared default path).
    dir: /path/to/media/%SERVER%
    # Which asset kinds to download. Drop any you don't want.
    assets: [attachments, avatars, emojis, stickers, guild-icons, guild-banners, role-icons, user-banners]

  data:
    reactions: true       # store each message's reactions + counts (from the payload, free)
    reactors: false       # ALSO fetch the full reactor list per emoji during catch-up/rescan
                          # (expensive: one paginated request per emoji per message). Live
                          # reactions are recorded from the gateway regardless.
    embeds: true
    stickers: true
    polls: true
    threads: true         # enumerate & watch threads (and thread creates)
    pins: true            # track pin changes
    members: true         # capture author guild-member info (nick/roles/join date) from the gateway
    guild-catalog: true   # periodically sync roles / emoji / stickers / scheduled events

  behavior:
    catch-up: true            # on connect, backfill every channel from its stored cursor
    scan-missing: false       # on connect, full re-scan of every channel (heavier than catch-up)
    catch-up-parallel: 10     # channels exported concurrently (per-channel rate limits are independent)
    retry-failed: false       # retry media URLs previously recorded as permanently gone (404/410)

  exclude:
    channels: []          # channel ids to skip entirely
    categories: []        # category ids -> skips all channels under them
    nsfw: false           # skip channels flagged NSFW
    threads: false        # skip all threads

  # Scheduled online backup of the database, taken via a separate read connection so it never blocks
  # live capture. Timestamped copies with a daily+weekly retention policy. Disabled by default.
  backup:
    enabled: false
    schedule: "30 5 * * *"  # 5-field cron in the container's timezone (TZ). 05:30 daily by default
                            # -- deliberately not 04:00, to avoid a router/network reboot window.
    dir: /data/backups      # required when enabled
    keep-daily: 7           # keep the newest copy for each of the last N days
    keep-weekly: 4          # ...plus the newest for each of the last N ISO weeks
    compress: false         # gzip each copy
    integrity-check: true   # PRAGMA quick_check each copy (notifies on failure)

  # Scheduled periodic full re-scan, to reconcile edits/reactions on already-stored messages that
  # live catch-up can't see. Runs in-process through the shared store (no cross-process locking).
  # Disabled by default.
  full-scan:
    enabled: false
    schedule: "0 4 * * 0"       # cron; weekly (Sun 04:00) by default
    channels: []                # explicit channel/thread ids; empty = everything in scope
    categories: []              # restrict to channels under these categories
    exclude-channels: []        # channel/thread ids to skip
    exclude-categories: []      # categories to skip
    include-threads: true       # also re-scan threads
    after: null                 # window lower bound: ISO date or duration ("30d","12h","2w","90m")
    before: null                # window upper bound (same forms). null = unbounded
    max-channels: null          # cap channels re-scanned per run (null = no cap)
    enrich-reactors: true       # fetch full reactor lists during the scan (see data.reactors)
    media: true                 # download media found during the scan. false suppresses media
                                # store-wide for the scan's duration (live capture included).
    # Note: full-scan exports run at the watcher's shared export concurrency
    # (behavior.catch-up-parallel); there is no separate per-scan parallelism knob.

servers:
  - name: My Server
    id: 000000000000000000            # your server (guild) id
    enabled: true
    output: /path/to/backups/my-server.db
    # Per-server overrides of the defaults above, e.g.:
    # media:
    #   dir: /path/to/media/my-server
    # exclude:
    #   channels: [111111111111111111]   # e.g. a staff channel

  # - name: Another Server
  #   id: 222222222222222222
  #   enabled: false
  #   output: /path/to/backups/another-server.db
